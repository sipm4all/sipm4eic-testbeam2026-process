# Self-trigger distinct-channel coincidence with a veto around the derived event time.
selector TIMING {
    type        = 1
    device      = 200
    fifo        = [0,7]
    column      = *
    pixel       = *
    time_offset = 0.
}

selector VETO {
    type        = 9
    device      = 200
    fifo        = 32
    column      = *
    pixel       = *
    time_offset = 0.
}

trigger {

    coincidence TIMING {
        dt      = [-10,+10]
        min     = 32
        unique  = channel
    }

    veto VETO {
        dt = [-50,+50]
    }

}
