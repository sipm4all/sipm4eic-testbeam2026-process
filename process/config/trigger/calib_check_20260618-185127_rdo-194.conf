# Calibration validation for run 20260618-185127 on rdo-194.
# Chips 4..7 are in opMode=2, so this seeds on a test-pulse channel in the same RDO.
selector TESTPULSE {
    type        = 1
    device      = 194
    fifo        = 16
    column      = 0
    pixel       = 0
    time_offset = 0.
}

trigger {
    seed TESTPULSE
}
