# Calibrated trigger tag plus range selector.
# [0,7] is inclusive and min = 32 counts all matching TIMING hits together.
# With calibrated inputs and time_offset = 0, event_time is the trigger calibrated time.
selector TRIGGER {
    type        = 9
    device      = 200
    fifo        = 32
    column      = *
    pixel       = *
    time_offset = 0.
}

selector TIMING {
    type        = 1
    device      = 200
    fifo        = [0,7]
    column      = *
    pixel       = *
    time_offset = 0.
}

trigger {
    seed TRIGGER

    require TIMING {
        dt  = [-10,+10]
        min = 32
    }
}
