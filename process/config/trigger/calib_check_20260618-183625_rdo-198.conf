# Calibration validation for run 20260618-183625 on rdo-198.
# Chips 0..3 are in opMode=2, so this seeds on a test-pulse channel in the same RDO.
selector TESTPULSE {
    type        = 1
    device      = 198
    fifo        = 0
    column      = 0
    pixel       = 0
    time_offset = 0.
}

trigger {
    seed TESTPULSE
}
