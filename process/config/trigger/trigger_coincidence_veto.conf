# Coincidence trigger with a trigger-tag veto in corrected/event-time coordinates.
selector A {
    type        = 1
    device      = 192
    fifo        = 3
    column      = 1
    pixel       = 12
    time_offset = 0.
}

selector B {
    type        = 1
    device      = 193
    fifo        = 5
    column      = *
    pixel       = *
    time_offset = 0.
}

selector VETO {
    type        = 9
    time_offset = 0.
}

trigger {
    seed A

    require B {
        dt  = [-10,+10]
        min = 1
    }

    veto VETO {
        dt = [-50,+50]
    }
}
