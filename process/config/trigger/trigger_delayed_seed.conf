# Delayed seed only. The frame is centered on event_time = raw_trigger_time - 110.
# The delayed seed hit is still stored exactly once in each accepted frame.
selector TRIGGER {
    type        = 9
    device      = 200
    fifo        = 32
    column      = *
    pixel       = *
    time_offset = 0.
}

trigger {
    seed TRIGGER
}
