[TDC]
# device fifo column pixel tdc off iif
# '*' means wildcard. Most-specific matching rule wins.
# Equal-specificity overlapping matches are errors.

# global nominal calibration
* * * * * 0.0 0.0157

# device-wide override
192 * * * * 0.5 0.0158

# exact TDC overrides
192 3 1 12 0 3.41 0.01563
192 3 1 12 1 2.87 0.01569

[CHANNEL]
