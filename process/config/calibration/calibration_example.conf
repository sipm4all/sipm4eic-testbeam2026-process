# positive offsets mean delayed channels and are subtracted from raw time

# default channel offset
* * * * 0.0

# individual/channel-group corrections
192 3 1 12 4.25
193 5 * * -2.10

[TRIGGER]
# device fifo offset
# positive offsets mean delayed trigger sources and are subtracted from raw time

# default
* * 0.0

# delayed trigger source
200 32 110.0
