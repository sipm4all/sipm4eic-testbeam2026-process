# Nominal dRICH geometry for the inverse ray-tracing analysis.
#
# All coordinates and radii are in millimetres.
# These values describe the nominal optical geometry.  Data-derived alignment
# corrections belong in a separate configuration.

[mirror]
center = (1150.08, 0.0, 939.0)
radius = 2203.01
# Mechanical rotation pivot of the mirror, in millimetres.
pivot_center = (327.9, 0.0, 3110.6)
# Mirror rotation about the mechanical pivot.
# The axis is expressed in global coordinates and must be normalized by the
# geometry reader. The angle is in radians; the nominal orientation is zero.
rotation_vector = (0.0, 0.0, 0.0)

[track]
origin = (0.0, 0.0, 0.0)
direction = (0.0, 0.0, 1.0)
emission_z = 2534.0

[assembly]
rotation_x_pivot = (0.0, 0.0, 2500.0)
rotation_x = 0.0
rotation_y_pivot = (0.0, 0.0, 0.0)
rotation_y = -0.09

[detector]
# The detector is a tangent plane located on a nominal sphere.
sphere_center = (1834.0, 0.0, 1414.0)
sphere_radius = 1100.0

# Direction from the sphere centre to the tangent-plane centre
# (plane centre = (1163.3, 0.0, 2282.6) mm).
# Angles are in radians.
theta = -0.66041320
phi = 0.0

# Rotation of the detector plane about its fixed plane centre.
rotation_vector = (0.0, 0.0, 0.0)
